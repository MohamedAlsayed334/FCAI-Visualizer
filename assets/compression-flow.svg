<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">FCAI-CU compression learning flow</title>
  <desc id="description">An animated illustration showing text transformed into dictionary tokens and then a compact bitstream.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="920" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B35"/>
      <stop offset="1" stop-color="#142B3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72E4C0"/>
      <stop offset="1" stop-color="#55B8FF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="958" height="298" rx="24" fill="url(#background)" stroke="#34465C" stroke-width="2"/>
  <circle cx="844" cy="38" r="90" fill="#55B8FF" fill-opacity=".06"/>
  <circle cx="92" cy="278" r="120" fill="#72E4C0" fill-opacity=".05"/>

  <text x="44" y="48" fill="#72E4C0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">FCAI-CU  /  INFORMATION THEORY</text>
  <text x="44" y="82" fill="#F3F7FF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Make every bit tell a story.</text>
  <text x="44" y="105" fill="#AAB9CC" font-family="Segoe UI, Arial, sans-serif" font-size="13">Explore how lossless algorithms transform data, one step at a time.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="142" width="218" height="105" rx="14" fill="#1B2A43" stroke="#34465C"/>
    <text x="67" y="166" fill="#AAB9CC" font-size="11" font-weight="700" letter-spacing="1.3">01  INPUT</text>
    <text x="67" y="198" fill="#F3F7FF" font-size="20" font-family="Consolas, monospace">ABRACADABRA</text>
    <text x="67" y="224" fill="#72E4C0" font-size="12">11 symbols</text>

    <path d="M286 194H354" stroke="#52677F" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M346 188L354 194L346 200" stroke="#72E4C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="371" y="142" width="218" height="105" rx="14" fill="#1B2A43" stroke="#34465C"/>
    <text x="390" y="166" fill="#AAB9CC" font-size="11" font-weight="700" letter-spacing="1.3">02  DICTIONARY</text>
    <text x="390" y="196" fill="#F3F7FF" font-size="15" font-family="Consolas, monospace">A · B · R · (AB)</text>
    <text x="390" y="220" fill="#72E4C0" font-size="12">LZ77  /  LZ78  /  LZW</text>

    <path d="M609 194H677" stroke="#52677F" stroke-width="2" stroke-dasharray="5 7"/>
    <path d="M669 188L677 194L669 200" stroke="#55B8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="694" y="142" width="218" height="105" rx="14" fill="#1B2A43" stroke="#34465C"/>
    <text x="713" y="166" fill="#AAB9CC" font-size="11" font-weight="700" letter-spacing="1.3">03  COMPACT BITS</text>
    <text x="713" y="198" fill="#F3F7FF" font-size="20" font-family="Consolas, monospace">010 11 001 10</text>
    <text x="713" y="224" fill="#55B8FF" font-size="12">See each decision unfold</text>
  </g>

  <g filter="url(#glow)">
    <circle r="5" fill="#72E4C0">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M285 194H365"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#55B8FF">
      <animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" path="M608 194H688"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="48" y="265" width="864" height="2" rx="1" fill="#34465C"/>
  <rect x="48" y="265" width="120" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="120;864;120" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
